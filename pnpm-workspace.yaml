allowBuilds:
  '@coinbase/x402': false
# mppx and viem each pin an exact ox, and a mismatch installs two copies. Both
# decode Tempo transactions, and the MPP rail recovers the payer address with one
# decoder while the SDK verifies with the other. Two versions could disagree, so
# hold the tree at a single ox, the one both currently pin. deny.toml enforces
# the same single-version rule for tempo-primitives on the Rust side.
overrides:
  ox: 1.8.9
  # The CDP SDK pins axios at 1.16.0 exactly, which pnpm audit flags
  # (GHSA advisories fixed in 1.18.0). Only its API client uses axios; the JWT
  # signing this service imports never touches it.
  axios: 1.20.0
  # vite brings in postcss 8.5.28, which asks for source-map-js 1.2.1. That
  # version is flagged by pnpm audit (GHSA-68fv-2mgg-jv7q, fixed in 1.2.2) and
  # only vitest reaches it, never the service.
  source-map-js: ^1.2.2
auditConfig:
  ignoreGhsas:
    # zod is fixed only in 4.6.6, and @x402/core requires zod 3, which has no
    # fixed release. Drop this once @x402/core moves to zod 4.
    - GHSA-mrhx-c7xc-m3w5

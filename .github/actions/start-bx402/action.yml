name: start bx402
description: Build the service and start it for an e2e run.

inputs:
  brave-search-api-key:
    description: Brave Search API key the server forwards upstream
    required: true
  x402-facilitator-url:
    description: >-
      x402 facilitator the server verifies and settles against. Empty leaves
      X402_FACILITATOR_URL unset, for runs that disable the x402 rail.
    required: false
    default: ""
  facilitator-private-key:
    description: >-
      Funded Base Sepolia key for our own facilitator. When set, the facilitator
      is built from the Dockerfile and served on localhost:8081 before bx402
      starts, so x402-facilitator-url can point at it. Empty starts none.
    required: false
    default: ""
  enabled-rails:
    description: >-
      ENABLED_RAILS value for the server. Empty leaves the variable unset,
      enabling both rails.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26
    - name: Enable pnpm
      shell: bash
      # The version comes from the packageManager field in package.json.
      run: corepack enable
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build
      shell: bash
      # Compiled here rather than shared as an artifact: the build is seconds,
      # and the service needs its dependencies installed beside it anyway.
      run: pnpm build
    - name: Start our facilitator
      if: inputs.facilitator-private-key != ''
      shell: bash
      env:
        FACILITATOR_PRIVATE_KEY: ${{ inputs.facilitator-private-key }}
      # Run from the image, as it is deployed, rather than with node beside
      # bx402: both programs bind the metrics port, and the container keeps the
      # facilitator's to itself. bx402 asks the facilitator what it supports as
      # it starts, so this comes first. With ALLOW_TESTNET and no BASE_RPC_URL
      # it settles on Base Sepolia alone.
      run: |
        docker build -q -t bx402 .
        docker run -d --name facilitator -p 8081:8080 \
          -e FACILITATOR_PRIVATE_KEY -e ALLOW_TESTNET=true \
          -e BASE_SEPOLIA_RPC_URL=https://sepolia.base.org \
          --entrypoint node bx402 dist/facilitator/main.js
        for _ in $(seq 1 60); do
          curl -sf -o /dev/null http://localhost:8081/health && exit 0
          sleep 1
        done
        docker logs facilitator >&2
        echo "facilitator never became healthy" >&2
        exit 1
    - name: Start bx402
      shell: bash
      env:
        BRAVE_SEARCH_API_KEY: ${{ inputs.brave-search-api-key }}
        X402_FACILITATOR_URL: ${{ inputs.x402-facilitator-url }}
        ENABLED_RAILS: ${{ inputs.enabled-rails }}
        ALLOW_TESTNET: "true"
      run: |
        # An empty input means "not provided": the server must see the variable
        # as unset, not as an empty string (an empty ENABLED_RAILS is a startup
        # error by design).
        if [ -z "$ENABLED_RAILS" ]; then unset ENABLED_RAILS; fi
        if [ -z "$X402_FACILITATOR_URL" ]; then unset X402_FACILITATOR_URL; fi
        # The MPP SDK refuses a secret under 32 bytes, which this clears.
        MPP_SECRET_KEY=$(openssl rand -hex 32) node dist/main.js > server.log 2>&1 &
        for _ in $(seq 1 30); do
          curl -sf -o /dev/null http://localhost:8080/health && exit 0
          sleep 1
        done
        echo "server never became healthy" >&2
        exit 1

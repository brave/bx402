services:
  bx402:
    build: .
    ports:
      - "8080:8080"
      # Metrics. Published here for local scraping; a real deployment keeps this
      # port inside the network.
      - "8090:8090"
    environment:
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      # The public testnet facilitator, or ours under the `facilitator` profile
      # below. Production runs ours.
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-https://x402.org/facilitator}
      MPP_RPC_URL: ${MPP_RPC_URL:-https://rpc.moderato.tempo.xyz}
      MPP_SECRET_KEY: ${MPP_SECRET_KEY}
      # Replay claims go to the local table below, as a real deployment's go to
      # a table every replica shares. DynamoDB Local takes any credentials.
      REPLAY_CLAIMS_TABLE_ID: bx402-replay-claims
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      # bx402 asks the facilitator what it supports as it starts, so it waits
      # for ours when that runs. Without the profile there is nothing to wait for.
      facilitator:
        condition: service_healthy
        required: false
      # bx402 checks the claim table as it starts, so the table must exist.
      dynamodb-table:
        condition: service_completed_successfully

  # The replay claim table, held in memory and gone when the stack stops.
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  # Creates the claim table with the key and expiry attribute the real one
  # has, then exits. A table left from an earlier run is kept as it is.
  dynamodb-table:
    image: amazon/aws-cli:2.39.3
    depends_on: [dynamodb]
    environment:
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        until aws dynamodb list-tables > /dev/null 2>&1; do sleep 1; done
        if aws dynamodb describe-table --table-name bx402-replay-claims > /dev/null 2>&1; then
          exit 0
        fi
        aws dynamodb create-table --table-name bx402-replay-claims \
          --attribute-definitions AttributeName=pk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST > /dev/null
        aws dynamodb update-time-to-live --table-name bx402-replay-claims \
          --time-to-live-specification Enabled=true,AttributeName=expiresAt > /dev/null

  # Our own facilitator on Base Sepolia, started only with
  # `docker compose --profile facilitator up`. bx402 uses it once
  # X402_FACILITATOR_URL=http://facilitator:8080 is set in `.env`. It pays the
  # settlement gas, so FACILITATOR_PRIVATE_KEY must hold Base Sepolia ETH. No
  # port is published: only bx402 talks to it.
  facilitator:
    build: .
    profiles: [facilitator]
    entrypoint: ["node", "dist/facilitator/main.js"]
    environment:
      FACILITATOR_PRIVATE_KEY: ${FACILITATOR_PRIVATE_KEY:-}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
    healthcheck:
      # The image has Node and no curl.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      retries: 12
